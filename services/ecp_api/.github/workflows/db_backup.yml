name: Scheduled Dual Database Backup (MySQL & MongoDB) to Nextcloud

on:
  schedule:
    # Chạy tự động lúc 02:00 AM UTC hàng ngày
    - cron: '0 2 * * *'
  # Cho phép kích hoạt chạy thủ công từ giao diện GitHub (Actions -> Run workflow)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Client Tools (MySQL, MongoDB Tools & Curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client mongodb-tools curl gzip tar

      - name: Run Dual Database Backup Script
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || secrets.MYSQL_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD || secrets.MYSQL_PASS }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST || '127.0.0.1' }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_DB: ${{ secrets.MYSQL_DB || 'ecp_local' }}
          SPRING_MONGODB_URI: ${{ secrets.SPRING_MONGODB_URI || secrets.MONGO_URI }}
          NEXTCLOUD_DOMAIN: ${{ secrets.NEXTCLOUD_DOMAIN }}
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_APP_PASS: ${{ secrets.NEXTCLOUD_APP_PASS }}
          NEXTCLOUD_TARGET_DIR: ${{ vars.NEXTCLOUD_TARGET_DIR || 'backups' }}
        run: |
          chmod +x ./scripts/backup_db.sh
          ./scripts/backup_db.sh
