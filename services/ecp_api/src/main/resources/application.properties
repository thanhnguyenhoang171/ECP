spring.application.name=ecp_api
server.port=${SERVER_PORT:9090}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool - Optimized for Production
spring.datasource.hikari.pool-name=ECP-HikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:20}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.register-mbeans=true

# MongoDB
spring.data.mongodb.uri=${SPRING_MONGODB_URI}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false

# Hibernate Batching & Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/mysql/migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false


# Jackson
spring.jackson.time-zone=GMT+7
spring.jackson.mapper.default-view-inclusion=true

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_REDIS_USERNAME:default}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}

# Pagination
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=1000

# File upload limits - Set high (500MB) to support video uploads and dynamic validation
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# Swagger
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
swagger.auth.username=${SWAGGER_USERNAME:admin}
swagger.auth.password=${SWAGGER_PASSWORD:swagger@123}

# Storage Provider Feature Flags (CLOUDINARY_SERVICE_ENABLE, MINIO_SERVICE_ENABLE)
storage.cloudinary.enabled=${CLOUDINARY_SERVICE_ENABLE:false}
storage.minio.enabled=${MINIO_SERVICE_ENABLE:true}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# MinIO S3 Storage Configuration
minio.endpoint=${MINIO_ENDPOINT:172.17.0.1:9050}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.use-ssl=${MINIO_USE_SSL:false}
minio.bucket-name=${MINIO_BUCKET_NAME:ecp-media}
minio.public-url=${MINIO_PUBLIC_URL:}

# Logging
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# Bật log chi tiết thông số của HikariCP
logging.level.com.zaxxer.hikari=${LOGGING_LEVEL_HIKARI:DEBUG}

# Telegram Notification for Error Logging
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}
telegram.enabled=${TELEGRAM_ENABLED:false}

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:}

# Spring Mail (SMTP Configuration)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.sender-name=${SPRING_MAIL_SENDER_NAME:Cacao Shop}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000