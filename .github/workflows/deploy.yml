name: ECP CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # JOB 1: KIỂM TRA CHẤT LƯỢNG CODE & BUILD (CHẠY CHO PR VÀ NHÁNH DEV)
  # ==========================================
  build-and-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm turbo lint

      - name: Build All Apps (Frontend & Backend)
        run: pnpm turbo build

  # ==========================================
  # JOB 2: BUILD DOCKER & PUSH LÊN GHCR (CHẠY TRỰC TIẾP KHI PUSH MAIN)
  # ==========================================
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile
            image: ghcr.io/${{ github.repository }}/ecp-admin
          - name: storefront
            context: .
            dockerfile: ./apps/storefront/Dockerfile
            image: ghcr.io/${{ github.repository }}/ecp-storefront
          - name: api
            context: ./services/ecp_api
            dockerfile: ./services/ecp_api/Dockerfile
            image: ghcr.io/${{ github.repository }}/ecp-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=${{ secrets.NEXT_PUBLIC_ADMIN_API_URL || secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STOREFRONT_API_URL=${{ secrets.NEXT_PUBLIC_STOREFRONT_API_URL || '/api' }}
            STOREFRONT_INTERNAL_API_URL=${{ secrets.STOREFRONT_INTERNAL_API_URL || secrets.INTERNAL_API_URL || secrets.NEXT_PUBLIC_API_URL }}
            INTERNAL_API_URL=${{ secrets.INTERNAL_API_URL || secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  # ==========================================
  # JOB 3: DEPLOY TRỰC TIẾP VỀ LAPTOP ASUS
  # ==========================================
  deploy-to-laptop:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Generate .env file securely
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MONGODB_URI: ${{ secrets.SPRING_MONGODB_URI }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          SPRING_REDIS_HOST: ${{ secrets.SPRING_REDIS_HOST }}
          SPRING_REDIS_PORT: ${{ secrets.SPRING_REDIS_PORT }}
          SPRING_REDIS_USERNAME: ${{ secrets.SPRING_REDIS_USERNAME }}
          SPRING_REDIS_PASSWORD: ${{ secrets.SPRING_REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          NEXT_PUBLIC_ADMIN_API_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_API_URL }}
          NEXT_PUBLIC_STOREFRONT_API_URL: ${{ secrets.NEXT_PUBLIC_STOREFRONT_API_URL }}
          STOREFRONT_INTERNAL_API_URL: ${{ secrets.STOREFRONT_INTERNAL_API_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const envVars = [
            "SPRING_DATASOURCE_URL", "SPRING_DATASOURCE_USERNAME", "SPRING_DATASOURCE_PASSWORD",
            "SPRING_MONGODB_URI", "MYSQL_ROOT_PASSWORD", "MYSQL_DATABASE", "MYSQL_USER",
            "MYSQL_PASSWORD", "MONGO_ROOT_USER", "MONGO_ROOT_PASSWORD", "SPRING_REDIS_HOST",
            "SPRING_REDIS_PORT", "SPRING_REDIS_USERNAME", "SPRING_REDIS_PASSWORD", "JWT_SECRET",
            "CLOUDINARY_CLOUD_NAME", "CLOUDINARY_API_KEY", "CLOUDINARY_API_SECRET",
            "SWAGGER_USERNAME", "SWAGGER_PASSWORD", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
            "SPRING_MAIL_HOST", "SPRING_MAIL_PORT", "SPRING_MAIL_USERNAME", "SPRING_MAIL_PASSWORD",
            "NEXT_PUBLIC_ADMIN_API_URL", "NEXT_PUBLIC_STOREFRONT_API_URL",
            "STOREFRONT_INTERNAL_API_URL", "INTERNAL_API_URL", "NEXT_PUBLIC_API_URL",
            "NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          ];
          const lines = envVars.map(k => `${k}=${process.env[k] !== undefined ? process.env[k] : ""}`);
          fs.writeFileSync(".env", lines.join("\n") + "\n");
          '

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 1. Thiết lập thư mục SSH và lưu Private Key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_ecp
          chmod 600 ~/.ssh/id_rsa_ecp

          # 2. Tạo file config SSH để ép dùng Cloudflared làm Proxy
          cat <<EOF > ~/.ssh/config
          Host asus-server
              HostName $SERVER_HOST
              User $SERVER_USER
              IdentityFile ~/.ssh/id_rsa_ecp
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
          EOF

          # 3. Copy file docker-compose.yml và .env an toàn lên server
          scp docker-compose.yml .env asus-server:~/ECP/

          # 4. Chạy lệnh deploy từ xa qua SSH
          ssh asus-server 'bash -s' << 'ENDSSH'
          set -e
          cd ~/ECP

          # Đăng nhập để có quyền kéo image private từ GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # 1. Kéo các image mới nhất về
          docker compose pull

          # 2. Tạo lại các Container có thay đổi (hạn chế restart không cần thiết)
          docker compose up -d --remove-orphans

          # 3. Dọn dẹp các Image cũ bị treo/dangling
          docker image prune -f
          ENDSSH